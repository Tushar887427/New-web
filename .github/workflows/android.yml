name: Android CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  # ---------------------------------------------------------------------------
  # Compile + unit tests + installable debug APK.
  # This job is the source of truth: it either produces an APK or tells us why
  # the project does not compile.
  # ---------------------------------------------------------------------------
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runners already ship an Android SDK. This action only
      # tops it up, so a hiccup here must never fail the build.
      - name: Set up Android SDK
        continue-on-error: true
        uses: android-actions/setup-android@v3

      - name: Resolve Android SDK location
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Resolved SDK: $SDK"
          ls "$SDK" || true
          echo "SDKMANAGER=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)" >> "$GITHUB_ENV"

      - name: Install SDK platform 35 if missing
        run: |
          if [ -d "$ANDROID_HOME/platforms/android-35" ]; then
            echo "android-35 already present"
          elif [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          else
            echo "::warning::sdkmanager not found; relying on the preinstalled SDK"
          fi

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee build.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee -a build.log

      - name: Assemble unsigned release APK
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee -a build.log

      # The raw Actions log is not always reachable from every client, so the
      # compiler/test errors are also published as an issue comment where they
      # can be read and acted on directly.
      - name: Publish build errors to an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f build.log ]; then echo "No build log"; exit 0; fi
          {
            echo "Automated report from [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) on \`${{ github.ref_name }}\` @ \`${GITHUB_SHA:0:7}\`."
            echo
            echo '```'
            grep -nE "^e: |^w: .*error|error:|FAILED|FAILURE:|Caused by|> Task .*FAILED|Execution failed|What went wrong" build.log \
              | head -120 || true
            echo '```'
          } > report.md
          if [ ! -s report.md ]; then echo "nothing extracted"; exit 0; fi
          # Repository issue list is used instead of `gh issue list --search`,
          # which depends on the (retired) projects-classic GraphQL field.
          NUM=$(gh api "repos/${{ github.repository }}/issues?state=open&per_page=100" \
                 --jq '[.[] | select(.title=="CI build failures")][0].number // empty')
          if [ -z "$NUM" ]; then
            NUM=$(gh api -X POST "repos/${{ github.repository }}/issues" \
                   -f title="CI build failures" \
                   -f body="Automated Android CI reports, newest first." \
                   --jq '.number')
          fi
          gh api -X POST "repos/${{ github.repository }}/issues/$NUM/comments" \
            -f body="$(cat report.md)" --jq '.html_url'

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} artifacts/ \; 2>/dev/null || true
          ls -lh artifacts || true
          cd artifacts && sha256sum *.apk > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt 2>/dev/null || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solo-admin-apk
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Solo Admin build"
            echo ""
            if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
              echo "✅ Debug APK built: \`$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)\`"
            else
              echo "❌ Debug APK was not produced — see the build log above."
            fi
            echo ""
            echo "### Unit tests"
            python3 - <<'PY' 2>/dev/null || echo "No test result XML found."
          import glob, xml.etree.ElementTree as ET
          total = fail = err = skipped = 0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r = ET.parse(f).getroot()
              total += int(r.get('tests', 0))
              fail += int(r.get('failures', 0))
              err += int(r.get('errors', 0))
              skipped += int(r.get('skipped', 0))
          print(f"| tests | failures | errors | skipped |")
          print(f"|---|---|---|---|")
          print(f"| {total} | {fail} | {err} | {skipped} |")
          if fail or err:
              print("\nFailing tests:")
              for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
                  for tc in ET.parse(f).getroot().iter('testcase'):
                      for bad in list(tc.iter('failure')) + list(tc.iter('error')):
                          msg = (bad.get('message') or '').strip().splitlines()[:3]
                          print(f"- `{tc.get('classname')}.{tc.get('name')}`: {' / '.join(msg)}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Static analysis. Informational only: it must not block the APK.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        continue-on-error: true

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - name: Lint debug
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Tagged builds publish installable APKs on a GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    name: Publish APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        continue-on-error: true

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - name: Build APKs
        run: |
          ./gradlew --no-daemon assembleDebug
          ./gradlew --no-daemon assembleRelease || true

      - name: Prepare assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/solo-admin-${GITHUB_REF_NAME}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk \
               "dist/solo-admin-${GITHUB_REF_NAME}-release-unsigned.apk"
          fi
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Solo Admin ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          body: |
            Native Android build of **Solo Admin — Gov Office Hub**.

            * `solo-admin-${{ github.ref_name }}-debug.apk` — installable directly
              (debug-signed). Enable "install unknown apps" for your file manager
              or browser, then open the file.
            * `solo-admin-${{ github.ref_name }}-release-unsigned.apk` — unsigned,
              for signing with your own keystore (see `docs/BUILD.md`).
            * `SHA256SUMS.txt` — verify the download.
          files: dist/*
          fail_on_unmatched_files: false
